<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
    <rect width="800" height="200" fill="#0f172a" rx="10"/>
    
    <defs>
        <linearGradient id="riskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
    </defs>
    
    <rect x="100" y="80" width="600" height="40" fill="url(#riskGrad)" rx="20"/>
    
    <!-- Low Risk -->
    <text x="150" y="60" fill="#10b981" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Low Risk</text>
    <text x="150" y="150" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Benign (NV, DF, VASC)</text>
    <circle cx="150" cy="100" r="8" fill="#fff" opacity="0.8"/>
    
    <!-- Medium Risk -->
    <text x="400" y="60" fill="#f59e0b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Medium Risk</text>
    <text x="400" y="150" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Monitor (BKL, AK)</text>
    <circle cx="400" cy="100" r="8" fill="#fff" opacity="0.8"/>
    
    <!-- High Risk -->
    <text x="650" y="60" fill="#ef4444" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">High Risk</text>
    <text x="650" y="150" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Malignant (MEL, BCC, SCC)</text>
    <circle cx="650" cy="100" r="8" fill="#fff" opacity="0.8"/>
</svg>
