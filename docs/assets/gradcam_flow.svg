<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
    <rect width="800" height="300" fill="#0f172a" rx="10"/>
    
    <rect x="50" y="100" width="150" height="100" fill="#1e293b" stroke="#3b82f6" stroke-width="3" rx="10"/>
    <text x="125" y="145" fill="#3b82f6" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Input Image</text>
    <text x="125" y="175" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Pixels (H, W, 3)</text>
    
    <rect x="250" y="100" width="150" height="100" fill="#1e293b" stroke="#14b8a6" stroke-width="3" rx="10"/>
    <text x="325" y="145" fill="#14b8a6" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">CNN Features</text>
    <text x="325" y="175" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Last Conv Layer</text>
    
    <rect x="450" y="100" width="120" height="100" fill="#1e293b" stroke="#a855f7" stroke-width="3" rx="10"/>
    <text x="510" y="145" fill="#a855f7" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Gradients</text>
    <text x="510" y="175" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">w.r.t Target</text>
    
    <rect x="620" y="100" width="130" height="100" fill="#1e293b" stroke="#f43f5e" stroke-width="3" rx="10"/>
    <text x="685" y="145" fill="#f43f5e" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Heatmap</text>
    <text x="685" y="175" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Overlay</text>
    
    <path d="M 200 150 L 240 150" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 400 150 L 440 150" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 570 150 L 610 150" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
        </marker>
    </defs>
</svg>
