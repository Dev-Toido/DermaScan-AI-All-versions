<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <rect width="800" height="400" fill="#0f172a" rx="10"/>
    
    <!-- Image Branch -->
    <rect x="50" y="50" width="150" height="100" fill="#1e293b" stroke="#3b82f6" stroke-width="3" rx="10"/>
    <text x="125" y="95" fill="#3b82f6" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Image Input</text>
    <text x="125" y="125" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Dermoscopic Image</text>
    
    <rect x="250" y="50" width="150" height="100" fill="#1e293b" stroke="#3b82f6" stroke-width="3" rx="10"/>
    <text x="325" y="95" fill="#3b82f6" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">EfficientNetB4</text>
    <text x="325" y="125" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">CNN Backbone</text>
    
    <!-- Metadata Branch -->
    <rect x="50" y="250" width="150" height="100" fill="#1e293b" stroke="#a855f7" stroke-width="3" rx="10"/>
    <text x="125" y="295" fill="#a855f7" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Metadata Input</text>
    <text x="125" y="325" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Age, Sex, Site</text>
    
    <rect x="250" y="250" width="150" height="100" fill="#1e293b" stroke="#a855f7" stroke-width="3" rx="10"/>
    <text x="325" y="295" fill="#a855f7" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Dense Layers</text>
    <text x="325" y="325" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Embeddings</text>
    
    <!-- Fusion -->
    <rect x="475" y="150" width="150" height="100" fill="#1e293b" stroke="#14b8a6" stroke-width="3" rx="10"/>
    <text x="550" y="195" fill="#14b8a6" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Fusion Layer</text>
    <text x="550" y="225" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Concatenation</text>
    
    <!-- Output -->
    <rect x="675" y="150" width="100" height="100" fill="#1e293b" stroke="#f43f5e" stroke-width="3" rx="10"/>
    <text x="725" y="195" fill="#f43f5e" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Softmax</text>
    <text x="725" y="225" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Prediction</text>
    
    <!-- Arrows -->
    <path d="M 200 100 L 240 100" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 200 300 L 240 300" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 400 100 L 450 100 L 450 180 L 465 180" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 400 300 L 450 300 L 450 220 L 465 220" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 625 200 L 665 200" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
        </marker>
    </defs>
</svg>
