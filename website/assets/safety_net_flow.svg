<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
    <rect width="600" height="500" fill="#0f172a" rx="10"/>
    
    <rect x="225" y="50" width="150" height="60" fill="#1e293b" stroke="#3b82f6" stroke-width="3" rx="30"/>
    <text x="300" y="85" fill="#3b82f6" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Prediction</text>
    
    <polygon points="300,150 400,225 300,300 200,225" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <text x="300" y="215" fill="#f59e0b" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Confidence</text>
    <text x="300" y="240" fill="#f59e0b" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">&ge; 60%?</text>
    
    <rect x="50" y="350" width="200" height="80" fill="#1e293b" stroke="#f43f5e" stroke-width="3" rx="10"/>
    <text x="150" y="385" fill="#f43f5e" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Safety Net</text>
    <text x="150" y="410" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">"Consult Dermatologist"</text>
    
    <rect x="350" y="350" width="200" height="80" fill="#1e293b" stroke="#10b981" stroke-width="3" rx="10"/>
    <text x="450" y="385" fill="#10b981" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Accept Prediction</text>
    <text x="450" y="410" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Map to Risk Group</text>
    
    <path d="M 300 110 L 300 140" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 230 250 L 150 250 L 150 340" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="190" y="240" fill="#94a3b8" font-family="Arial" font-size="16" font-weight="bold">No</text>
    
    <path d="M 370 250 L 450 250 L 450 340" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="390" y="240" fill="#94a3b8" font-family="Arial" font-size="16" font-weight="bold">Yes</text>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
        </marker>
    </defs>
</svg>
