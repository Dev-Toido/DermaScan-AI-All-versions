name: Auto Update Documentation

on:
  push:
    branches:
      - main
      - v5-dev
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Auto-Docs Script
        run: |
          # If we create an auto-doc script in the future, it runs here.
          # For now, this just updates a timestamp in a tracking file to prove it works.
          mkdir -p docs
          echo "Last automated documentation update: $(date)" > docs/latest_update.txt
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update documentation [skip ci]" && git push)
